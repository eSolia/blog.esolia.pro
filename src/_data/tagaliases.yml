# Retired tag names, mapped to the canonical tag that replaced them.
#
# Two things consume this file:
#
# 1. `archive_result.page.js` turns each entry into an `oldUrl` on the
#    canonical tag's page, so Lume's redirects plugin emits a 301 from the
#    retired name's URL. Without that, consolidating a tag silently 404s every
#    link and bookmark pointing at the old one.
#
# 2. `_config.ts` canonicalises `tags` on every page at build time. That is the
#    important half: if an author types a retired name — from memory, from an
#    old post, or by picking it out of a stale autocomplete — it is rewritten
#    to the canonical tag instead of resurrecting the retired one. A
#    resurrected name would also collide with its own redirect and break the
#    build, so this is load-bearing, not cosmetic.
#
# Only names that actually existed as tags are listed. Names differing from
# their canonical ONLY by letter case are deliberately excluded: the redirect
# page and the canonical page would occupy the same path on a case-insensitive
# filesystem, which fails the build. Case-only changes still get canonicalised
# by (2); they just get no redirect.
