- key: Microsoft-365
  id: cat1
  color: cyan
  image: /assets/cat1a-bg.jpg
  summary: >-
    Outlook, Teams, OneDrive, SharePoint and Copilot — the tools most of our
    clients live in all day. Practical fixes for the problems that actually come
    up, like files that will not open after a SharePoint migration or a calendar
    that refuses to sync, alongside guides to getting more out of features you
    may already be paying for.
- key: Security
  id: cat2
  color: esoliaamber
  image: /assets/cat2-bg.jpg
  summary: >-
    The everyday security habits that protect a business, explained without
    jargon. Spotting a phishing email before you click, managing passwords in a
    way people will actually stick to, keeping a clear desk and clear screen,
    and understanding why an email attachment can be more dangerous than it
    looks. Grounded in the ISO 27001 practices we follow ourselves.
- key: Network
  id: cat3
  color: fuchsia
  image: /assets/cat3-bg.jpg
  summary: >-
    How the plumbing works, for people who are not network engineers. Cabling
    and connectors explained in plain terms, what a server actually is and does,
    how a small office network fits together, and where things typically go
    wrong. Useful background for anyone who has nodded along in a meeting
    without quite following.
- key: Cloud
  id: cat4
  color: lime
  image: /assets/cat4-bg.jpg
  summary: >-
    Working from anywhere, and the IT that makes it possible. Cloud tools,
    remote access and the shift in how offices operate — including our own
    long-running look at proactive telework in Japan, and what changed between
    the first wave and today.
- key: Troubleshooting
  id: cat5
  color: emerald
  image: /assets/cat5-bg.jpg
  summary: >-
    When something stops working, start here. Step-by-step fixes for the
    failures we see most: a frozen PC, no internet, a laptop battery that will
    not hold charge, a dialog that has swallowed the screen, or a machine that
    took a drink. Written so a non-specialist can follow them without calling
    for help.
- key: AI-Usage
  id: cat6
  color: red
  image: /assets/cat6-bg.jpg
  summary: >-
    Using AI as a working tool rather than a novelty. How to turn a vague
    understanding of an IT term into a real one by asking the right questions,
    and honest accounts of where ChatGPT and similar tools genuinely save time
    in day-to-day work — and where they do not.
- key: Windows
  id: cat7
  color: sky
  image: /assets/cat7-bg.jpg
  summary: >-
    Getting more out of Windows, from features people miss to habits that save
    time every day. Screenshots without extra software, clipboard history beyond
    Win + V, what actually changed after the Windows 11 upgrade, whether it is
    safe to pull out a USB drive, and what Copilot does to your machine's
    performance.
- key: Peripherals
  id: cat8
  color: teal
  image: /assets/cat8-bg.jpg
  summary: >-
    The hardware on and around the desk: keyboards, monitors, docks, cables and
    batteries. Why keyboard layouts and function keys ended up the way they did,
    how to keep equipment working longer, and what to check when a device that
    should just work does not.
- key: Ways of Working
  id: cat9
  color: violet
  image: /assets/cat9-bg.jpg
  summary: >-
    How we work, rather than which tool we use. Keeping focus while working from
    home, stepping away from the screen on purpose, setting up a workspace that
    does not wear you down, and a look at what the people who run IT actually
    contribute beyond the technology itself.
- key: Documents
  id: cat10
  color: amber
  image: /assets/cat2b-bg.jpg
  summary: >-
    Creating, editing and managing business documents. Mostly PDF and Adobe
    Acrobat — what the format actually is and why it behaves as it does, plus
    the editing, page-handling, security and signature features that
    administrative teams use day to day, and the limits worth knowing before you
    rely on them.
