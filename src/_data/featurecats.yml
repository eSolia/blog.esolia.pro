- key: Microsoft-365
  id: cat1
  color: cyan
  image: /assets/cat1a-bg.jpg
  summary: >-
    Outlook、Teams、OneDrive、SharePoint、Copilot
    など、多くのお客様が日々お使いのツールを取り上げます。SharePoint移行後にファイルが開けない、予定表が同期されないといった実際によく起こる問題への対処法から、すでに契約済みの機能をより活かすための使い方まで、実務に沿った内容でご紹介します。
- key: セキュリティ
  id: cat2
  color: esoliaamber
  image: /assets/cat2-bg.jpg
  summary: >-
    専門用語に頼らず、日々の業務を守るセキュリティ習慣をお伝えします。クリックする前にフィッシングメールを見分ける方法、無理なく続けられるパスワード管理、クリアデスク・クリアスクリーンの考え方、そして添付ファイルが見た目以上に危険になりうる理由。当社自身が実践するISO
    27001の考え方に基づいています。
- key: ネットワーク
  id: cat3
  color: fuchsia
  image: /assets/cat3-bg.jpg
  summary: >-
    ネットワーク技術者ではない方に向けて、社内の「配管」がどう動いているかを解説します。ケーブルやコネクタの種類、サーバーとは結局なにをするものか、小規模オフィスのネットワーク構成、そしてトラブルが起きやすい箇所。会議でなんとなく頷いてきた方の予備知識としてお役立てください。
- key: クラウド
  id: cat4
  color: lime
  image: /assets/cat4-bg.jpg
  summary: >-
    どこでも働けるようにするためのIT環境について。クラウドツールやリモートアクセス、そしてオフィスのあり方の変化を取り上げます。日本における「攻めのテレワーク」を長年追ってきた記事もあり、第一波の頃と現在で何が変わったのかも振り返ります。
- key: トラブルシューティング
  id: cat5
  color: emerald
  image: /assets/cat5-bg.jpg
  summary: >-
    うまく動かなくなったときは、まずこちらへ。PCのフリーズ、インターネットに繋がらない、ノートPCのバッテリーが持たない、画面を覆うダイアログ、水没といった、実際によく遭遇する不具合の手順を掲載しています。専門知識がなくても、ご自身で試せる内容にまとめました。
- key: AI活用
  id: cat6
  color: red
  image: /assets/cat6-bg.jpg
  summary: >-
    AIを話題としてではなく、仕事の道具として使うために。IT用語の「なんとなく分かる」を「ちゃんと分かる」に変える質問の仕方や、ChatGPTなどが日常業務で実際に時間を節約できる場面、そして期待しすぎない方がよい場面についても率直にお伝えします。
- key: Windows
  id: cat7
  color: sky
  image: /assets/cat7-bg.jpg
  summary: >-
    見落とされがちな機能から、毎日の時短につながる習慣まで、Windowsをより活かすための記事です。追加ソフトなしでのスクリーンショット、Win +
    Vの先にあるクリップボード履歴、Windows
    11へのアップグレードで実際に変わった点、USBメモリは抜いても大丈夫なのか、CopilotがPCの動作に与える影響などを扱います。
- key: 周辺機器
  id: cat8
  color: teal
  image: /assets/cat8-bg.jpg
  summary: >-
    キーボード、モニター、ドック、ケーブル、バッテリーなど、机まわりのハードウェアについて。キーボード配列やファンクションキーが現在の形になった経緯、機器を長く使い続けるための手入れ、そして「動いて当然」の機器が動かないときに確認すべき点をご紹介します。
- key: 働き方
  id: cat9
  color: violet
  image: /assets/cat9-bg.jpg
  summary: >-
    どのツールを使うかではなく、どう働くかについて。在宅勤務で集中力を保つ工夫、意識的に画面から離れる習慣、心身に負担をかけない作業環境づくり、そしてIT担当者が技術そのもの以外にもたらしている価値について考えます。
- key: 文書管理
  id: cat10
  color: amber
  image: /assets/cat2b-bg.jpg
  summary: >-
    業務文書の作成・編集・管理について。中心となるのはPDFとAdobe
    Acrobatです。そもそもPDFとはどのような形式で、なぜそのように振る舞うのかという基本から、管理部門が日常的に使う編集・ページ操作・セキュリティ・署名の各機能、そして頼りきる前に知っておきたい制限まで解説します。
